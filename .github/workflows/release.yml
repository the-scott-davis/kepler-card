name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm
      - name: Check the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${TAG#v}" != "$version" ]; then
            echo "tag $TAG does not match package.json version $version"
            exit 1
          fi
      - run: npm ci
      - run: npm run package
      - name: Upload kepler-card.js to the release
        run: gh release upload "$TAG" kepler-card.js --clobber
      - name: Check the asset is on the release
        run: |
          gh release view "$TAG" --json assets --jq '.assets[].name' | tee assets.txt
          if ! grep -qx 'kepler-card.js' assets.txt; then
            echo "kepler-card.js is not listed on release $TAG"
            exit 1
          fi
