name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm
      - name: Check the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${TAG#v}" != "$version" ]; then
            echo "tag $TAG does not match package.json version $version"
            exit 1
          fi
      - run: npm ci
      - run: npm run build
      - name: Zip kepler-card.js at the zip root
        run: zip kepler-card.zip kepler-card.js
      - name: Check the zip contents
        run: |
          unzip -l kepler-card.zip
          if ! unzip -Z1 kepler-card.zip | grep -qx 'kepler-card.js'; then
            echo "kepler-card.zip does not contain kepler-card.js at its root"
            exit 1
          fi
      - name: Upload the zip to the release
        run: gh release upload "$TAG" kepler-card.zip --clobber
      - name: Check the asset is on the release
        run: |
          gh release view "$TAG" --json assets --jq '.assets[].name' | tee assets.txt
          if ! grep -qx 'kepler-card.zip' assets.txt; then
            echo "kepler-card.zip is not listed on release $TAG"
            exit 1
          fi
